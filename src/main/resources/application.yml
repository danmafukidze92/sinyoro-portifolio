server:
  port: ${PORT:8690}
  # Nginx Proxy Manager terminates HTTPS and forwards X-Forwarded-* headers
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml

spring:
  application:
    name: sinyoro-portfolio
  # Optional SMTP (e.g. your mailcow server). Set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and
  # SPRING_MAIL_PASSWORD as environment variables to email contact messages; without them messages are only
  # appended to data/messages.log.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  contact:
    to: ${CONTACT_TO:danmafukidze92@gmail.com}
    from: ${CONTACT_FROM:}
    store-dir: ${CONTACT_STORE_DIR:./data}
    max-per-hour: 5

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
